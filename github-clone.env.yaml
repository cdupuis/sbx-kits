# Clone a GitHub repo into a sandbox.
#
#   sbx env run github-clone.env.yaml --env-arg repo=owner/name
#   sbx env run github-clone.env.yaml --env-arg repo=owner/name --env-arg dir=/workspace/src
#   sbx env rm

schemaVersion: "1"

args:
  repo:
    required: true
    description: GitHub repository to clone (`owner/name`, HTTPS, or SSH URL).
    pattern: '^(?:[A-Za-z0-9._-]+/[A-Za-z0-9._-]+(?:\.git)?|https://github\.com/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+(?:\.git)?|git@github\.com:[A-Za-z0-9._-]+/[A-Za-z0-9._-]+(?:\.git)?)$'
  name:
    default: gh-clone
    description: Sandbox name (letters, digits, dots, hyphens; no slashes).
    pattern: '^[a-zA-Z0-9][a-zA-Z0-9.-]+$'
  dir:
    default: /project
    description: Absolute directory inside the sandbox to clone into.
    pattern: '^/[A-Za-z0-9._/-]+$'

name: ${{ env.args.name }}
agent: claude

kits:
  - source: git+https://github.com/cdupuis/sbx-kits.git#dir=github-clone
    args:
      repo: ${{ env.args.repo }}
      dir: ${{ env.args.dir }}

workspace: .

secrets:
  github:
    command: gh auth token

bindings:
  github:
    apiKey:
      domains:
        - api.github.com
