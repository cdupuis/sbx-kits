# Clone a GitHub repo into a sandbox.
#
#   sbx env run github-clone.env.yaml --env-arg owner=docker --env-arg repo=sbx
#   sbx env run github-clone.env.yaml --env-arg owner=docker --env-arg repo=sbx --env-arg pr=42
#   sbx env rm

schemaVersion: "1"

args:
  owner:
    required: true
    description: GitHub owner (user or org).
    pattern: '^[A-Za-z0-9][A-Za-z0-9.-]*$'
  repo:
    required: true
    description: GitHub repository name (not owner/name).
    pattern: '^[A-Za-z0-9][A-Za-z0-9.-]*$'
  pr:
    default: ""
    description: Optional pull request number to check out after the clone.
    pattern: '^[0-9]*$'
  agent:
    default: claude
    description: Built-in agent (e.g. claude, codex, gemini).

name: ${{ env.args.owner }}-${{ env.args.repo }}
agent: ${{ env.args.agent }}

kits:
  #- source: git+https://github.com/cdupuis/sbx-kits.git#dir=github-clone
  - source: ./github-clone
    args:
      repo: ${{ env.args.owner }}/${{ env.args.repo }}
      pr: ${{ env.args.pr }}
      dir: /home/agent/workspace
    
secrets:
  github:
    command: gh auth token

env:
  REPO_SLUG: ${{ env.args.owner }}/${{ env.args.repo }}
  REPO: ${{ env.args.repo }}
  OWNER: ${{ env.args.owner }}

bindings:
  github:
    apiKey:
      domains:
        - api.github.com
        - github.com
